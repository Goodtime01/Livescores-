<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores - Tennis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 70px; }

    /* Top 4-Sport Navigation Bar */
    .sport-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .sport-nav::-webkit-scrollbar { display: none; }
    .sport-btn { background: #1e293b; color: #94a3b8; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 1px solid #334155; white-space: nowrap; }
    .sport-btn.active { background: #22c55e; color: #0b1120; border-color: #22c55e; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.2rem; color: #22c55e; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-weight: 700; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: #22c55e; color: #0b1120; border: none; }

    /* Date Bar */
    .date-bar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border-radius: 8px; padding: 6px 8px; margin-bottom: 10px; gap: 6px; }
    .date-nav-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .date-picker-wrap { display: flex; align-items: center; gap: 6px; background: #0b1120; border: 1px solid #334155; padding: 4px 8px; border-radius: 6px; flex: 1; justify-content: center; }
    .date-picker-input { background: transparent; border: none; color: #22c55e; font-weight: 700; font-size: 0.8rem; outline: none; color-scheme: dark; font-family: inherit; width: 100%; text-align: center; cursor: pointer; }
    .today-btn { background: #22c55e; color: #0b1120; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; }

    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 14px; border-radius: 16px; font-size: 0.75rem; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .tab.active { background: #22c55e; color: #0b1120; border-color: #22c55e; }

    /* Match Cards */
    .matches-container { display: flex; flex-direction: column; gap: 10px; }
    .tennis-card { background: #1e293b; border-radius: 10px; padding: 12px 14px; border: 1px solid #334155; }
    .tennis-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; font-weight: 700; }
    .share-btn { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }

    .player-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #0f172a; }
    .player-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; width: 55%; }
    .player-info img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }
    .player-winner { color: #22c55e; }

    .sets-row { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; font-weight: 800; }
    .set-box { width: 20px; text-align: center; color: #cbd5e1; }
    .set-total { width: 24px; text-align: center; color: #22c55e; font-size: 0.95rem; }

    .tennis-footer { font-size: 0.72rem; text-align: center; color: #fbbf24; font-weight: 700; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- Top 4-Sport Bar (Always Visible) -->
  <div class="sport-nav">
    <a href="index.html" class="sport-btn">⚽ Football</a>
    <a href="basketball.html" class="sport-btn">🏀 Basketball</a>
    <a href="combat.html" class="sport-btn">🥊 Combat</a>
    <a href="tennis.html" class="sport-btn active">🎾 Tennis</a>
  </div>

  <header>
    <h1>🎾 Etini LiveScores</h1>
    <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
  </header>

  <!-- Date Bar -->
  <div class="date-bar">
    <button class="date-nav-btn" onclick="stepDate(-1)">◀</button>
    <div class="date-picker-wrap">
      <span>📅</span>
      <input type="date" id="calendarInput" class="date-picker-input" onchange="onCalendarSelect(this.value)" />
    </div>
    <button class="date-nav-btn" onclick="stepDate(1)">▶</button>
    <button class="today-btn" onclick="resetToToday()">Today</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search player (e.g. Alcaraz, Sinner, Swiatek)..." oninput="renderMatches()" />
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTour('atp', this)">ATP (Men)</button>
    <button class="tab" onclick="setTour('wta', this)">WTA (Women)</button>
  </div>

  <div class="matches-container" id="matchList">
    <div style="text-align:center; padding:30px; color:#94a3b8;">Loading tennis matches...</div>
  </div>


<script>
    let activeTour = "atp";
    let tennisData = [];
    let currentDate = new Date();

    // Calendar Engine
    function formatApiDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function formatInputDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function syncCalendarDisplay() {
      const input = document.getElementById("calendarInput");
      if (input) input.value = formatInputDate(currentDate);
    }

    function onCalendarSelect(val) {
      if (!val) return;
      const [y, m, d] = val.split("-").map(Number);
      currentDate = new Date(y, m - 1, d);
      initLoad();
    }

    function stepDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      syncCalendarDisplay();
      initLoad();
    }

    function resetToToday() {
      currentDate = new Date();
      syncCalendarDisplay();
      initLoad();
    }

    function setTour(tour, btn) {
      activeTour = tour;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      initLoad();
    }

    // Universal Share
    async function shareMatch(e, id) {
      e.stopPropagation();
      const m = tennisData.find(x => x.id === id);
      if (!m) return;

      const shareData = {
        title: "Etini Tennis LiveScores",
        text: `🎾 ${m.player1} (${m.p1Score}) vs ${m.player2} (${m.p2Score})\n🏆 ${m.tournament} (${m.status})\nFollow live:`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
          alert("Tennis score & link copied to clipboard! 📋");
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`, "_blank");
        });
      }
    }

    async function initLoad() {
      syncCalendarDisplay();
      const container = document.getElementById("matchList");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Loading official tournament matches...</div>';

      tennisData = [];
      const dt = formatApiDate(currentDate);

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/tennis/${activeTour}/scoreboard?dates=${dt}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        (data.events || []).forEach(ev => {
          const c = ev.competitions?.[0] || {};
          const p1 = c.competitors?.[0] || {};
          const p2 = c.competitors?.[1] || {};

          // 5-Layer Name Extraction (Never defaults to "Player 1")
          let p1Name = p1.athlete?.displayName 
                    || p1.athlete?.fullName 
                    || p1.athlete?.name 
                    || p1.displayName 
                    || p1.name;

          let p2Name = p2.athlete?.displayName 
                    || p2.athlete?.fullName 
                    || p2.athlete?.name 
                    || p2.displayName 
                    || p2.name;

          // Doubles Check
          if (!p1Name && p1.roster?.athletes?.length) {
            p1Name = p1.roster.athletes.map(a => a.displayName || a.shortName).join(' / ');
          }
          if (!p2Name && p2.roster?.athletes?.length) {
            p2Name = p2.roster.athletes.map(a => a.displayName || a.shortName).join(' / ');
          }

          // Fallback to Event Name (e.g. "Swiatek vs. Sabalenka")
          if ((!p1Name || p1Name === 'Player 1') && ev.name) {
            const parts = ev.name.split(/\s+vs\.?\s+/i);
            if (parts.length >= 2) {
              p1Name = parts[0].trim();
              p2Name = parts[1].trim();
            }
          }

          if (!p1Name) p1Name = "TBD";
          if (!p2Name) p2Name = "TBD";

          const p1Lines = p1.linescores || [];
          const p2Lines = p2.linescores || [];

          tennisData.push({
            id: ev.id,
            tournament: data.leagues?.[0]?.name || ev.name || (activeTour === 'atp' ? 'ATP Tour' : 'WTA Tour'),
            round: c.notes?.[0]?.headline || "Main Draw",
            player1: p1Name,
            player1Flag: p1.athlete?.flag?.href || '',
            player1Score: p1.score ?? "0",
            player1Winner: p1.winner || false,
            player1Lines: p1Lines,
            player2: p2Name,
            player2Flag: p2.athlete?.flag?.href || '',
            player2Score: p2.score ?? "0",
            player2Winner: p2.winner || false,
            player2Lines: p2Lines,
            status: c.status?.type?.shortDetail || c.status?.type?.description || "Scheduled"
          });
        });
      } catch (err) {}

      if (tennisData.length === 0) {
        container.innerHTML = '<div class="tennis-card" style="text-align:center; color:#94a3b8; padding:25px;">No matches on this date. Tournaments run during scheduled tour weeks. Tap "Today" or use the calendar 📅 above to pick another date!</div>';
        return;
      }

      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = [...tennisData];
      if (q) list = list.filter(m => m.player1.toLowerCase().includes(q) || m.player2.toLowerCase().includes(q) || m.tournament.toLowerCase().includes(q));

      if (list.length === 0) {
        container.innerHTML = '<div class="tennis-card" style="text-align:center; color:#94a3b8; padding:20px;">No matching tennis players found.</div>';
        return;
      }

      container.innerHTML = list.map(m => {
        const maxSets = Math.max(m.player1Lines.length, m.player2Lines.length, 1);
        let setHeaders = "";
        for (let i = 1; i <= maxSets; i++) setHeaders += `<div class="set-box">S${i}</div>`;

        let p1SetScores = "";
        for (let i = 0; i < maxSets; i++) {
          p1SetScores += `<div class="set-box">${m.player1Lines[i]?.value ?? "-"}</div>`;
        }

        let p2SetScores = "";
        for (let i = 0; i < maxSets; i++) {
          p2SetScores += `<div class="set-box">${m.player2Lines[i]?.value ?? "-"}</div>`;
        }

        return `
          <div class="tennis-card">
            <div class="tennis-header">
              <span>${m.tournament} • ${m.round}</span>
              <button class="share-btn" onclick="shareMatch(event, '${m.id}')">🔗 Share</button>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:8px; font-size:0.7rem; color:#94a3b8; margin-bottom:4px; font-weight:700;">
              ${setHeaders}
              <div class="set-total">Sets</div>
            </div>

            <!-- Player 1 -->
            <div class="player-row">
              <div class="player-info ${m.player1Winner ? 'player-winner' : ''}">
                ${m.player1Flag ? `<img src="${m.player1Flag}">` : '🎾'}
                <span>${m.player1}</span>
              </div>
              <div class="sets-row">
                ${p1SetScores}
                <div class="set-total">${m.player1Score}</div>
              </div>
            </div>

            <!-- Player 2 -->
            <div class="player-row">
              <div class="player-info ${m.player2Winner ? 'player-winner' : ''}">
                ${m.player2Flag ? `<img src="${m.player2Flag}">` : '🎾'}
                <span>${m.player2}</span>
              </div>
              <div class="sets-row">
                ${p2SetScores}
                <div class="set-total">${m.player2Score}</div>
              </div>
            </div>

            <div class="tennis-footer">${m.status}</div>
          </div>
        `;
      }).join("");
    }

    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
