<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores - Tennis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 70px; }

    /* Top Sport Bar */
    .sport-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .sport-nav::-webkit-scrollbar { display: none; }
    .sport-btn { background: #1e293b; color: #94a3b8; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 1px solid #334155; white-space: nowrap; }
    .sport-btn.active { background: #10b981; color: #0b1120; border-color: #10b981; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.2rem; color: #10b981; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-weight: 700; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: #10b981; color: #0b1120; border: none; }

    /* Calendar Bar */
    .date-bar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border-radius: 8px; padding: 6px 8px; margin-bottom: 10px; gap: 6px; }
    .date-nav-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .date-picker-wrap { display: flex; align-items: center; gap: 6px; background: #0b1120; border: 1px solid #334155; padding: 4px 8px; border-radius: 6px; flex: 1; justify-content: center; }
    .date-picker-input { background: transparent; border: none; color: #10b981; font-weight: 700; font-size: 0.8rem; outline: none; color-scheme: dark; font-family: inherit; width: 100%; text-align: center; cursor: pointer; }
    .today-btn { background: #10b981; color: #0b1120; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; }

    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    /* Tennis League Tabs */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 14px; border-radius: 16px; font-size: 0.75rem; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .tab.active { background: #10b981; color: #0b1120; border-color: #10b981; }

    /* Match Cards */
    .matches-container { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: #1e293b; border-radius: 10px; padding: 14px; border: 1px solid #334155; }
    .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; font-weight: 700; }
    .share-btn { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }

    /* Tennis Set-by-Set Score Table */
    .tennis-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    .tennis-player-cell { display: flex; align-items: center; gap: 6px; font-weight: 700; padding: 6px 0; }
    .tennis-player-cell img { width: 18px; height: 12px; object-fit: cover; border-radius: 2px; }
    .set-col { width: 28px; text-align: center; font-weight: 700; padding: 4px; color: #94a3b8; }
    .set-col.active-set { color: #10b981; font-weight: 900; }
    .total-sets { width: 34px; text-align: center; font-weight: 900; color: #10b981; font-size: 1rem; }

    .match-footer { font-size: 0.72rem; text-align: center; color: #fbbf24; font-weight: 600; margin-top: 10px; border-top: 1px dashed #334155; padding-top: 6px; }
    .status-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(16, 185, 129, 0.2); color: #10b981; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 9999px; }
    .live-dot { width: 6px; height: 6px; background: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top Sports Switcher Bar -->
  <div class="sport-nav">
    <a href="index.html" class="sport-btn">⚽ Football</a>
    <a href="basketball.html" class="sport-btn">🏀 Basketball</a>
    <a href="combat.html" class="sport-btn">🥊 Combat (UFC/Boxing)</a>
    <a href="tennis.html" class="sport-btn active">🎾 Tennis</a>
  </div>

  <header>
    <h1>🎾 Etini LiveScores</h1>
    <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
  </header>

  <!-- Calendar Bar -->
  <div class="date-bar">
    <button class="date-nav-btn" onclick="stepDate(-1)">◀</button>
    <div class="date-picker-wrap">
      <span>📅</span>
      <input type="date" id="calendarInput" class="date-picker-input" onchange="onCalendarSelect(this.value)" />
    </div>
    <button class="date-nav-btn" onclick="stepDate(1)">▶</button>
    <button class="today-btn" onclick="resetToToday()">Today</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search player (e.g. Alcaraz, Djokovic, Sabalenka)..." oninput="renderMatches()" />
  </div>

  <!-- Tennis Tour Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setTour('atp', this)">ATP (Men)</button>
    <button class="tab" onclick="setTour('wta', this)">WTA (Women)</button>
  </div>

  <div class="matches-container" id="matchList">
    <div style="text-align:center; padding:30px; color:#94a3b8;">Loading tennis matches...</div>
  </div>

<script>
    let activeTour = "atp";
    let tennisData = [];
    let currentDate = new Date();

    // Calendar Engine
    function formatApiDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function formatInputDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function syncCalendarDisplay() {
      const input = document.getElementById("calendarInput");
      if (input) input.value = formatInputDate(currentDate);
    }

    function onCalendarSelect(val) {
      if (!val) return;
      const [y, m, d] = val.split("-").map(Number);
      currentDate = new Date(y, m - 1, d);
      initLoad();
    }

    function stepDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      syncCalendarDisplay();
      initLoad();
    }

    function resetToToday() {
      currentDate = new Date();
      syncCalendarDisplay();
      initLoad();
    }

    function setTour(tour, btn) {
      activeTour = tour;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      initLoad();
    }

    // Universal Share
    async function shareMatch(e, id) {
      e.stopPropagation();
      const m = tennisData.find(x => x.id === id);
      if (!m) return;

      const shareData = {
        title: "Etini Tennis LiveScores",
        text: `🎾 ${m.p1Name} vs ${m.p2Name}\n🏆 ${m.tournament} (${m.status})\nFollow live:`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
          alert("Tennis score & link copied to clipboard! 📋");
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`, "_blank");
        });
      }
    }

    async function initLoad() {
      syncCalendarDisplay();
      const container = document.getElementById("matchList");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Loading tennis matches...</div>';

      tennisData = [];
      const dt = formatApiDate(currentDate);

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/tennis/${activeTour}/scoreboard?dates=${dt}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        (data.events || []).forEach(ev => {
          const c = ev.competitions?.[0] || {};
          const p1 = c.competitors?.[0] || {};
          const p2 = c.competitors?.[1] || {};

          tennisData.push({
            id: ev.id,
            tournament: data.leagues?.[0]?.name || ev.name || (activeTour === 'atp' ? 'ATP Tour' : 'WTA Tour'),
            round: c.type?.text || c.notes?.[0]?.headline || 'Main Draw',
            p1Name: p1.athlete?.displayName || 'Player 1',
            p1Flag: p1.athlete?.flag?.href || '',
            p1Score: p1.score ?? '-',
            p1Lines: p1.linescores || [],
            p1Win: p1.winner || false,
            p2Name: p2.athlete?.displayName || 'Player 2',
            p2Flag: p2.athlete?.flag?.href || '',
            p2Score: p2.score ?? '-',
            p2Lines: p2.linescores || [],
            p2Win: p2.winner || false,
            state: c.status?.type?.state,
            status: c.status?.type?.shortDetail || c.status?.type?.description || 'Scheduled'
          });
        });
      } catch (err) {}

      if (tennisData.length === 0) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:25px;">No tennis matches scheduled for this date. Use the calendar 📅 above to pick another date!</div>';
        return;
      }

      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = [...tennisData];
      if (q) list = list.filter(m => m.p1Name.toLowerCase().includes(q) || m.p2Name.toLowerCase().includes(q) || m.tournament.toLowerCase().includes(q));

      if (list.length === 0) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:20px;">No matching players found.</div>';
        return;
      }

      container.innerHTML = list.map(m => {
        let badge = m.status;
        if (m.state === "in") badge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${m.status}</span>`;

        // Render up to 5 set scores (e.g. S1, S2, S3, S4, S5)
        const setColsCount = Math.max(m.p1Lines.length, m.p2Lines.length, 1);
        let headerThs = "";
        for (let i = 0; i < setColsCount; i++) headerThs += `<th class="set-col">S${i + 1}</th>`;

        let p1Tds = "", p2Tds = "";
        for (let i = 0; i < setColsCount; i++) {
          const s1 = m.p1Lines[i]?.value ?? "-";
          const s2 = m.p2Lines[i]?.value ?? "-";
          p1Tds += `<td class="set-col ${s1 > s2 ? 'active-set' : ''}">${s1}</td>`;
          p2Tds += `<td class="set-col ${s2 > s1 ? 'active-set' : ''}">${s2}</td>`;
        }

        return `
          <div class="match-card">
            <div class="match-header">
              <span>${m.tournament} • ${m.round}</span>
              <button class="share-btn" onclick="shareMatch(event, '${m.id}')">🔗 Share</button>
            </div>
            
            <table class="tennis-table">
              <thead>
                <tr>
                  <th style="text-align:left; color:#94a3b8;">Player</th>
                  ${headerThs}
                  <th class="total-sets">Sets</th>
                </tr>
              </thead>
              <tbody>
                <tr style="${m.p1Win ? 'color:#10b981;' : ''}">
                  <td class="tennis-player-cell">
                    ${m.p1Flag ? `<img src="${m.p1Flag}">` : '🎾'}
                    <span>${m.p1Name} ${m.p1Win ? '✓' : ''}</span>
                  </td>
                  ${p1Tds}
                  <td class="total-sets">${m.p1Score}</td>
                </tr>
                <tr style="${m.p2Win ? 'color:#10b981;' : ''}">
                  <td class="tennis-player-cell">
                    ${m.p2Flag ? `<img src="${m.p2Flag}">` : '🎾'}
                    <span>${m.p2Name} ${m.p2Win ? '✓' : ''}</span>
                  </td>
                  ${p2Tds}
                  <td class="total-sets">${m.p2Score}</td>
                </tr>
              </tbody>
            </table>

            <div class="match-footer">${badge}</div>
          </div>
        `;
      }).join("");
    }

    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
