<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores - Formula 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 70px; }

    /* Multi-Sport Ribbon */
    .sport-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .sport-nav::-webkit-scrollbar { display: none; }
    .sport-btn { background: #1e293b; color: #94a3b8; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 1px solid #334155; white-space: nowrap; }
    .sport-btn.active { background: #e10600; color: #fff; border-color: #e10600; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.2rem; color: #e10600; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-weight: 700; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: #e10600; color: #fff; border: none; }

    .search-box { margin-bottom: 12px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    /* F1 Grand Prix Card */
    .f1-card { background: #1e293b; border-radius: 12px; padding: 14px; border: 1px solid #334155; margin-bottom: 12px; }
    .f1-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: #94a3b8; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
    .f1-race-name { font-size: 1.05rem; font-weight: 900; color: #f8fafc; margin-bottom: 4px; }
    .f1-circuit { font-size: 0.72rem; color: #38bdf8; margin-bottom: 10px; }
    .share-btn { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }

    /* Driver Leaderboard Table */
    .f1-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 8px; }
    .f1-table th { background: #0b1120; color: #94a3b8; padding: 6px; font-size: 0.68rem; text-transform: uppercase; text-align: left; }
    .f1-table td { padding: 8px 6px; border-bottom: 1px solid #334155; }
    .pos-cell { font-weight: 900; color: #e10600; width: 26px; }
    .driver-name { font-weight: 700; color: #f8fafc; }
    .team-name { font-size: 0.68rem; color: #94a3b8; }
    .pts-cell { font-weight: 800; color: #38bdf8; text-align: right; }

    .status-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 9999px; }
    .live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Full Multi-Sport Ribbon -->
  <div class="sport-nav">
    <a href="index.html" class="sport-btn">⚽ Football</a>
    <a href="basketball.html" class="sport-btn">🏀 Basketball</a>
    <a href="combat.html" class="sport-btn">🥊 Combat</a>
    <a href="tennis.html" class="sport-btn">🎾 Tennis</a>
    <a href="cricket.html" class="sport-btn">🏏 Cricket</a>
    <a href="hockey.html" class="sport-btn">🏒 Hockey</a>
    <a href="baseball.html" class="sport-btn">⚾ Baseball</a>
    <a href="rugby.html" class="sport-btn">🏉 Rugby</a>
    <a href="f1.html" class="sport-btn active">🏎️ Formula 1</a>
  </div>

  <header>
    <h1>🏎️ Etini LiveScores</h1>
    <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search driver or team (e.g. Verstappen, Hamilton, Ferrari)..." oninput="renderRaces()" />
  </div>

  <div id="raceContainer">
    <div style="text-align:center; padding:30px; color:#94a3b8;">Loading Formula 1 Grand Prix standings...</div>
  </div>

<script>
    let racesData = [];

    // Universal Share
    async function shareRace(e, id) {
      e.stopPropagation();
      const r = racesData.find(x => x.id === id);
      if (!r) return;

      const shareData = {
        title: "Etini F1 LiveScores",
        text: `🏎️ ${r.name} - ${r.circuit} (${r.status})\nFollow live:`,
        url: window.location.href
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
          alert("F1 race link copied to clipboard! 📋");
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`, "_blank");
        });
      }
    }

    async function initLoad() {
      const container = document.getElementById("raceContainer");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Loading Formula 1 Grand Prix standings...</div>';

      racesData = [];

      try {
        const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard");
        if (!res.ok) throw new Error();
        const data = await res.json();

        (data.events || []).forEach(ev => {
          const comp = ev.competitions?.[0] || {};
          const drivers = (comp.competitors || []).map((c, idx) => ({
            pos: c.order || c.place || (idx + 1),
            name: c.athlete?.displayName || c.athlete?.shortName || "Driver",
            team: c.team?.displayName || c.team?.name || "Formula 1 Team",
            pts: c.points ?? "-"
          }));

          racesData.push({
            id: ev.id,
            name: ev.name || "Formula 1 Grand Prix",
            circuit: comp.venue ? `${comp.venue.fullName || ''} (${comp.venue.address?.city || ''})` : 'FIA Official Circuit',
            status: comp.status?.type?.shortDetail || comp.status?.type?.description || "Scheduled",
            state: comp.status?.type?.state || "pre",
            drivers: drivers
          });
        });
      } catch (err) {}

      if (racesData.length === 0) {
        container.innerHTML = '<div class="f1-card" style="text-align:center; color:#94a3b8; padding:25px;">No active Grand Prix race this week. Race weekends run on Friday to Sunday schedule!</div>';
        return;
      }

      renderRaces();
    }

    function renderRaces() {
      const container = document.getElementById("raceContainer");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = [...racesData];

      container.innerHTML = list.map(r => {
        let filteredDrivers = r.drivers;
        if (q) {
          filteredDrivers = filteredDrivers.filter(d => d.name.toLowerCase().includes(q) || d.team.toLowerCase().includes(q));
        }

        let driverRows = "";
        if (filteredDrivers.length > 0) {
          driverRows = filteredDrivers.slice(0, 15).map(d => `
            <tr>
              <td class="pos-cell">${d.pos}</td>
              <td>
                <div class="driver-name">${d.name}</div>
                <div class="team-name">${d.team}</div>
              </td>
              <td class="pts-cell">${d.pts}</td>
            </tr>
          `).join("");
        } else {
          driverRows = '<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:12px;">Driver lineup will update at Grand Prix practice & qualifying.</td></tr>';
        }

        let badge = r.status;
        if (r.state === "in") badge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${r.status}</span>`;

        return `
          <div class="f1-card">
            <div class="f1-header">
              <span>Grand Prix Weekend</span>
              <button class="share-btn" onclick="shareRace(event, '${r.id}')">🔗 Share</button>
            </div>
            <div class="f1-race-name">${r.name}</div>
            <div class="f1-circuit">🏁 ${r.circuit}</div>
            <div style="font-size:0.75rem; color:#fbbf24; font-weight:700; margin-bottom:10px;">${badge}</div>

            <table class="f1-table">
              <thead>
                <tr>
                  <th>POS</th>
                  <th>DRIVER & CONSTRUCTOR</th>
                  <th style="text-align:right;">PTS / GAP</th>
                </tr>
              </thead>
              <tbody>
                ${driverRows}
              </tbody>
            </table>
          </div>
        `;
      }).join("");
    }

    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
