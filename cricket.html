<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores - Cricket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 70px; }

    /* Scrollable Multi-Sport Ribbon */
    .sport-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .sport-nav::-webkit-scrollbar { display: none; }
    .sport-btn { background: #1e293b; color: #94a3b8; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 1px solid #334155; white-space: nowrap; }
    .sport-btn.active { background: #eab308; color: #0b1120; border-color: #eab308; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.2rem; color: #eab308; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-weight: 700; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: #eab308; color: #0b1120; border: none; }

    /* Date Bar */
    .date-bar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border-radius: 8px; padding: 6px 8px; margin-bottom: 10px; gap: 6px; }
    .date-nav-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .date-picker-wrap { display: flex; align-items: center; gap: 6px; background: #0b1120; border: 1px solid #334155; padding: 4px 8px; border-radius: 6px; flex: 1; justify-content: center; }
    .date-picker-input { background: transparent; border: none; color: #eab308; font-weight: 700; font-size: 0.8rem; outline: none; color-scheme: dark; font-family: inherit; width: 100%; text-align: center; cursor: pointer; }
    .today-btn { background: #eab308; color: #0b1120; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; }

    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    /* Cricket Match Cards */
    .matches-container { display: flex; flex-direction: column; gap: 10px; }
    .cricket-card { background: #1e293b; border-radius: 10px; padding: 14px; border: 1px solid #334155; cursor: pointer; }
    .cricket-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase; font-weight: 700; }
    .share-btn { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }

    .team-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #0f172a; }
    .team-info { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 700; width: 50%; }
    .team-info img { width: 22px; height: 22px; object-fit: contain; }
    .team-score { font-size: 1rem; font-weight: 900; color: #eab308; }
    .team-overs { font-size: 0.7rem; color: #94a3b8; margin-left: 6px; font-weight: 600; }

    .match-result { background: #0b1120; border-radius: 6px; padding: 6px 10px; text-align: center; font-size: 0.72rem; color: #fbbf24; font-weight: 700; margin-top: 8px; }
    .match-venue { font-size: 0.68rem; color: #94a3b8; text-align: center; margin-top: 6px; font-style: italic; }

    .status-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 9999px; }
    .live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top 9-Sport Ribbon -->
  <div class="sport-nav">
    <a href="index.html" class="sport-btn">⚽ Football</a>
    <a href="basketball.html" class="sport-btn active">🏀 Basketball</a>
    <a href="combat.html" class="sport-btn">🥊 Combat</a>
    <a href="tennis.html" class="sport-btn">🎾 Tennis</a>
    <a href="cricket.html" class="sport-btn">🏏 Cricket</a>
    <a href="hockey.html" class="sport-btn">🏒 Hockey</a>
    <a href="baseball.html" class="sport-btn">⚾ Baseball</a>
    <a href="rugby.html" class="sport-btn">🏉 Rugby</a>
    <a href="f1.html" class="sport-btn">🏎️ Formula 1</a>
  </div>

  <header>
    <h1>🏏 Etini LiveScores</h1>
    <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
  </header>

  <!-- Calendar Bar -->
  <div class="date-bar">
    <button class="date-nav-btn" onclick="stepDate(-1)">◀</button>
    <div class="date-picker-wrap">
      <span>📅</span>
      <input type="date" id="calendarInput" class="date-picker-input" onchange="onCalendarSelect(this.value)" />
    </div>
    <button class="date-nav-btn" onclick="stepDate(1)">▶</button>
    <button class="today-btn" onclick="resetToToday()">Today</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search team (e.g. India, Australia, England)..." oninput="renderMatches()" />
  </div>

  <div class="matches-container" id="matchList">
    <div style="text-align:center; padding:30px; color:#94a3b8;">Loading cricket matches...</div>
  </div>


<script>
    let cricketData = [];
    let currentDate = new Date();

    // Calendar Engine
    function formatApiDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function formatInputDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function syncCalendarDisplay() {
      const input = document.getElementById("calendarInput");
      if (input) input.value = formatInputDate(currentDate);
    }

    function onCalendarSelect(val) {
      if (!val) return;
      const [y, m, d] = val.split("-").map(Number);
      currentDate = new Date(y, m - 1, d);
      initLoad();
    }

    function stepDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      syncCalendarDisplay();
      initLoad();
    }

    function resetToToday() {
      currentDate = new Date();
      syncCalendarDisplay();
      initLoad();
    }

    // Universal Share
    async function shareMatch(e, id) {
      e.stopPropagation();
      const m = cricketData.find(x => x.id === id);
      if (!m) return;

      const shareData = {
        title: "Etini Cricket LiveScores",
        text: `🏏 ${m.team1} (${m.team1Score}) vs ${m.team2} (${m.team2Score})\n🏆 ${m.series} (${m.status})\nFollow live:`,
        url: window.location.href
      };

      if (navigator.share) {
        try { await navigator.share(shareData); } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
          alert("Cricket score & link copied to clipboard! 📋");
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`, "_blank");
        });
      }
    }

    async function initLoad() {
      syncCalendarDisplay();
      const container = document.getElementById("matchList");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Loading live cricket matches...</div>';

      cricketData = [];
      const dt = formatApiDate(currentDate);

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/cricket/scoreboard?dates=${dt}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        (data.events || []).forEach(ev => {
          const c = ev.competitions?.[0] || {};
          const t1 = c.competitors?.[0] || {};
          const t2 = c.competitors?.[1] || {};

          // Extract runs/wickets & overs (e.g. 248/6 (45.2 ov))
          const t1Overs = t1.linescores?.[0]?.overs ? `(${t1.linescores[0].overs} ov)` : '';
          const t2Overs = t2.linescores?.[0]?.overs ? `(${t2.linescores[0].overs} ov)` : '';

          cricketData.push({
            id: ev.id,
            series: data.leagues?.[0]?.name || ev.name || c.notes?.[0]?.headline || "Cricket Tournament",
            team1: t1.team?.shortDisplayName || t1.team?.displayName || "Team 1",
            team1Logo: t1.team?.logo || '',
            team1Score: t1.score ?? "-",
            team1Overs: t1Overs,
            team2: t2.team?.shortDisplayName || t2.team?.displayName || "Team 2",
            team2Logo: t2.team?.logo || '',
            team2Score: t2.score ?? "-",
            team2Overs: t2Overs,
            status: c.status?.type?.shortDetail || c.status?.type?.description || "Scheduled",
            state: c.status?.type?.state || "pre",
            venue: c.venue ? `${c.venue.fullName || ''} (${c.venue.address?.city || ''})` : ''
          });
        });
      } catch (err) {}

      if (cricketData.length === 0) {
        container.innerHTML = '<div class="cricket-card" style="text-align:center; color:#94a3b8; padding:25px;">No cricket matches on this date. Use the calendar 📅 above to pick matchday fixtures!</div>';
        return;
      }

      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = [...cricketData];
      if (q) list = list.filter(m => m.team1.toLowerCase().includes(q) || m.team2.toLowerCase().includes(q) || m.series.toLowerCase().includes(q));

      if (list.length === 0) {
        container.innerHTML = '<div class="cricket-card" style="text-align:center; color:#94a3b8; padding:20px;">No matching teams found.</div>';
        return;
      }

      container.innerHTML = list.map(m => {
        let badge = m.status;
        if (m.state === "in") badge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${m.status}</span>`;

        return `
          <div class="cricket-card">
            <div class="cricket-header">
              <span>${m.series}</span>
              <button class="share-btn" onclick="shareMatch(event, '${m.id}')">🔗 Share</button>
            </div>

            <!-- Team 1 -->
            <div class="team-row">
              <div class="team-info">
                ${m.team1Logo ? `<img src="${m.team1Logo}">` : '🏏'}
                <span>${m.team1}</span>
              </div>
              <div style="text-align:right;">
                <span class="team-score">${m.team1Score}</span>
                <span class="team-overs">${m.team1Overs}</span>
              </div>
            </div>

            <!-- Team 2 -->
            <div class="team-row">
              <div class="team-info">
                ${m.team2Logo ? `<img src="${m.team2Logo}">` : '🏏'}
                <span>${m.team2}</span>
              </div>
              <div style="text-align:right;">
                <span class="team-score">${m.team2Score}</span>
                <span class="team-overs">${m.team2Overs}</span>
              </div>
            </div>

            <div class="match-result">${badge}</div>
            ${m.venue ? `<div class="match-venue">📍 ${m.venue}</div>` : ''}
          </div>
        `;
      }).join("");
    }

    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
