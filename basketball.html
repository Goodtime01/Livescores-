<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores - Basketball</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 70px; }

    /* Top Sport Bar (Flashscore Switcher) */
    .sport-nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .sport-nav::-webkit-scrollbar { display: none; }
    .sport-btn { background: #1e293b; color: #94a3b8; text-decoration: none; padding: 7px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; border: 1px solid #334155; white-space: nowrap; }
    .sport-btn.active { background: #f97316; color: #0b1120; border-color: #f97316; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.2rem; color: #f97316; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .header-btns { display: flex; gap: 6px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 10px; border-radius: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.72rem; cursor: pointer; }
    .btn-primary { background: #f97316; color: #0b1120; border: none; font-weight: 700; }
    .btn-sound.active { background: rgba(34, 197, 94, 0.2); color: #4ade80; border-color: #22c55e; }

    /* Interactive Calendar Bar */
    .date-bar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border-radius: 8px; padding: 6px 8px; margin-bottom: 10px; gap: 6px; }
    .date-nav-btn { background: #334155; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .date-picker-wrap { display: flex; align-items: center; gap: 6px; background: #0b1120; border: 1px solid #334155; padding: 4px 8px; border-radius: 6px; flex: 1; justify-content: center; }
    .date-picker-input { background: transparent; border: none; color: #f97316; font-weight: 700; font-size: 0.8rem; outline: none; color-scheme: dark; font-family: inherit; width: 100%; text-align: center; cursor: pointer; }
    .today-btn { background: #f97316; color: #0b1120; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 0.72rem; cursor: pointer; }

    .search-box { margin-bottom: 10px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    /* Basketball League Tabs */
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 5px 14px; border-radius: 16px; font-size: 0.75rem; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .tab.active { background: #f97316; color: #0b1120; border-color: #f97316; }

    /* Match Cards */
    .matches-container { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: #1e293b; border-radius: 10px; padding: 12px 14px; border: 1px solid #334155; cursor: pointer; }
    .match-card.is-favorite { border: 1px solid #facc15; box-shadow: 0 0 10px rgba(250, 204, 21, 0.15); }
    .match-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .share-btn { background: #0284c7; color: #fff; border: none; padding: 3px 8px; border-radius: 4px; font-size: 0.68rem; font-weight: 700; cursor: pointer; }
    .fav-btn { background: none; border: none; font-size: 1rem; cursor: pointer; line-height: 1; }

    .match-body { display: flex; justify-content: space-between; align-items: center; }
    .team { width: 38%; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .team img { width: 24px; height: 24px; object-fit: contain; }
    .team.away { justify-content: flex-end; text-align: right; }
    .score-box { background: #0b1120; padding: 6px 12px; border-radius: 6px; font-size: 1.2rem; font-weight: 900; color: #f97316; min-width: 60px; text-align: center; }
    .match-footer { font-size: 0.72rem; text-align: center; color: #fbbf24; font-weight: 600; margin-top: 8px; }

    /* Expandable Quarter Linescore */
    .linescore-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #334155; text-align: center; display: none; }
    .linescore-table.open { display: table; }
    .linescore-table th { color: #94a3b8; padding: 4px; font-weight: 600; }
    .linescore-table td { padding: 4px; font-weight: 700; }
    .venue-tag { font-size: 0.68rem; color: #94a3b8; text-align: center; margin-top: 6px; font-style: italic; }

    .status-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 9999px; }
    .live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Top Sports Switcher Bar -->
  <div class="sport-nav">
    <a href="index.html" class="sport-btn">⚽ Football</a>
    <a href="basketball.html" class="sport-btn active">🏀 Basketball</a>
    <a href="combat.html" class="sport-btn">🥊 Combat (UFC/Boxing)</a>
    <a href="tennis.html" class="sport-btn">🎾 Tennis</a>
  </div>

  <header>
    <h1>🏀 Etini LiveScores</h1>
    <div class="header-btns">
      <button class="btn btn-sound active" id="soundBtn" onclick="toggleSound()">🔊 Alerts</button>
      <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
    </div>
  </header>

  <!-- Calendar Bar -->
  <div class="date-bar">
    <button class="date-nav-btn" onclick="stepDate(-1)">◀</button>
    <div class="date-picker-wrap">
      <span>📅</span>
      <input type="date" id="calendarInput" class="date-picker-input" onchange="onCalendarSelect(this.value)" />
    </div>
    <button class="date-nav-btn" onclick="stepDate(1)">▶</button>
    <button class="today-btn" onclick="resetToToday()">Today</button>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 Search team (e.g. Lakers, Celtics, Warriors)..." oninput="renderMatches()" />
  </div>

  <!-- Basketball Leagues -->
  <div class="tabs">
    <button class="tab active" onclick="setLeague('nba', this)">NBA</button>
    <button class="tab" onclick="setLeague('wnba', this)">WNBA</button>
    <button class="tab" onclick="setLeague('mens-college-basketball', this)">NCAA College</button>
  </div>

  <div class="matches-container" id="matchList">
    <div style="text-align:center; padding:30px; color:#94a3b8;">Loading basketball games...</div>
  </div>


<script>
    let activeLeague = "nba";
    let matchesData = [];
    let favTeams = JSON.parse(localStorage.getItem("etini_bball_favs") || "[]");
    let soundEnabled = true;
    let currentDate = new Date();

    // Calendar Engine
    function formatApiDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function formatInputDate(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function syncCalendarDisplay() {
      const input = document.getElementById("calendarInput");
      if (input) input.value = formatInputDate(currentDate);
    }

    function onCalendarSelect(val) {
      if (!val) return;
      const [y, m, d] = val.split("-").map(Number);
      currentDate = new Date(y, m - 1, d);
      initLoad();
    }

    function stepDate(delta) {
      currentDate.setDate(currentDate.getDate() + delta);
      syncCalendarDisplay();
      initLoad();
    }

    function resetToToday() {
      currentDate = new Date();
      syncCalendarDisplay();
      initLoad();
    }

    // Audio & Alerts
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("soundBtn");
      btn.classList.toggle("active", soundEnabled);
      btn.innerText = soundEnabled ? "🔊 Alerts" : "🔇 Mute";
    }

    function playGoalAlert() {
      if (!soundEnabled) return;
      if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      } catch (e) {}
    }

    function setLeague(league, btn) {
      activeLeague = league;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      initLoad();
    }

    function toggleFav(e, team) {
      e.stopPropagation();
      if (favTeams.includes(team)) favTeams = favTeams.filter(t => t !== team);
      else favTeams.push(team);
      localStorage.setItem("etini_bball_favs", JSON.stringify(favTeams));
      renderMatches();
    }

    // Universal Share (Native Sheet + Clipboard Fallback)
    async function shareMatch(e, id) {
      e.stopPropagation();
      const m = matchesData.find(x => x.id === id);
      if (!m) return;

      const shareData = {
        title: "Etini Basketball LiveScores",
        text: `🏀 ${m.home} ${m.homeScore} - ${m.awayScore} ${m.away}\n🏆 ${m.leagueName} (${m.statusText})\nFollow live:`,
        url: window.location.href
      };

      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
          alert("Basketball score & link copied to clipboard! 📋");
        }).catch(() => {
          window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`, "_blank");
        });
      }
    }

    function toggleLinescore(id) {
      const table = document.getElementById(`ls-${id}`);
      if (table) table.classList.toggle("open");
    }

    async function initLoad() {
      syncCalendarDisplay();
      const container = document.getElementById("matchList");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Loading basketball games...</div>';

      const oldScores = new Map(matchesData.map(m => [m.id, `${m.homeScore}:${m.awayScore}`]));
      matchesData = [];
      const dt = formatApiDate(currentDate);

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/${activeLeague}/scoreboard?dates=${dt}`);
        if (!res.ok) throw new Error();
        const data = await res.json();

        (data.events || []).forEach(ev => {
          const c = ev.competitions[0];
          const home = c.competitors.find(x => x.homeAway === "home") || c.competitors[0];
          const away = c.competitors.find(x => x.homeAway === "away") || c.competitors[1];

          const currentScore = `${home.score ?? "-"}:${away.score ?? "-"}`;
          if (oldScores.has(ev.id) && oldScores.get(ev.id) !== currentScore && c.status.type.state === "in") {
            playGoalAlert();
          }

          // Linescores (Quarter Breakdown: Q1, Q2, Q3, Q4, OT)
          const homeLines = home.linescores || [];
          const awayLines = away.linescores || [];

          matchesData.push({
            id: ev.id,
            leagueName: data.leagues?.[0]?.name || activeLeague.toUpperCase(),
            home: home.team.shortDisplayName || home.team.name,
            homeLogo: home.team.logo || '',
            homeScore: home.score ?? "-",
            homeLines: homeLines,
            away: away.team.shortDisplayName || away.team.name,
            awayLogo: away.team.logo || '',
            awayScore: away.score ?? "-",
            awayLines: awayLines,
            state: c.status.type.state,
            statusText: c.status.type.shortDetail || c.status.type.description,
            venue: c.venue ? `${c.venue.fullName || ''} (${c.venue.address?.city || ''})` : ''
          });
        });
      } catch (err) {}

      if (matchesData.length === 0) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:25px;">No basketball games on this date. Use the calendar 📅 above to pick another date!</div>';
        return;
      }

      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = [...matchesData];
      if (q) list = list.filter(m => m.home.toLowerCase().includes(q) || m.away.toLowerCase().includes(q));

      list.sort((a, b) => {
        const aFav = favTeams.includes(a.home) || favTeams.includes(a.away);
        const bFav = favTeams.includes(b.home) || favTeams.includes(b.away);
        return bFav - aFav;
      });

      if (list.length === 0) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:20px;">No matching teams found.</div>';
        return;
      }

      container.innerHTML = list.map(m => {
        let badge = m.statusText;
        if (m.state === "in") badge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${m.statusText}</span>`;

        const isFav = favTeams.includes(m.home) || favTeams.includes(m.away);

        // Build Quarter Breakdown Table (Q1-Q4)
        let linescoreHtml = "";
        if (m.homeLines.length > 0) {
          let headers = m.homeLines.map((_, i) => `<th>${i < 4 ? 'Q' + (i + 1) : 'OT' + (i - 3)}</th>`).join('');
          let homeScores = m.homeLines.map(l => `<td>${l.value ?? '-'}</td>`).join('');
          let awayScores = m.awayLines.map(l => `<td>${l.value ?? '-'}</td>`).join('');

          linescoreHtml = `
            <table class="linescore-table" id="ls-${m.id}">
              <thead>
                <tr>
                  <th style="text-align:left;">Team</th>
                  ${headers}
                  <th>Total</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td style="text-align:left;">${m.home}</td>
                  ${homeScores}
                  <td style="color:#f97316;">${m.homeScore}</td>
                </tr>
                <tr>
                  <td style="text-align:left;">${m.away}</td>
                  ${awayScores}
                  <td style="color:#f97316;">${m.awayScore}</td>
                </tr>
              </tbody>
            </table>
          `;
        }

        return `
          <div class="match-card ${isFav ? 'is-favorite' : ''}" onclick="toggleLinescore('${m.id}')">
            <div class="match-header">
              <span>${m.leagueName}</span>
              <div class="header-actions">
                <button class="share-btn" onclick="shareMatch(event, '${m.id}')">🔗 Share</button>
                <button class="fav-btn" onclick="toggleFav(event, '${m.home}')">${isFav ? '⭐' : '☆'}</button>
                <span style="color:#f97316;">Quarters ▾</span>
              </div>
            </div>
            <div class="match-body">
              <div class="team">${m.homeLogo ? `<img src="${m.homeLogo}">` : ''}<span>${m.home}</span></div>
              <div class="score-box">${m.homeScore} : ${m.awayScore}</div>
              <div class="team away"><span>${m.away}</span>${m.awayLogo ? `<img src="${m.awayLogo}">` : ''}</div>
            </div>
            <div class="match-footer">${badge}</div>
            ${linescoreHtml}
            ${m.venue ? `<div class="venue-tag">🏟️ ${m.venue}</div>` : ''}
          </div>
        `;
      }).join("");
    }

    // Launch Basketball Engine
    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
