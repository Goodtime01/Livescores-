<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 14px; min-height: 100vh; padding-bottom: 50px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    header h1 { font-size: 1.25rem; color: #38bdf8; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .header-btns { display: flex; gap: 6px; }
    .btn { background: #1e293b; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; font-weight: 600; color: #cbd5e1; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: #38bdf8; color: #0b1120; border: none; font-weight: 700; }

    .view-switcher { display: flex; background: #1e293b; border-radius: 8px; padding: 3px; margin-bottom: 12px; }
    .view-btn { flex: 1; padding: 8px; font-size: 0.85rem; font-weight: 700; border: none; background: transparent; color: #94a3b8; border-radius: 6px; cursor: pointer; }
    .view-btn.active { background: #38bdf8; color: #0b1120; }

    .search-box { margin-bottom: 12px; }
    .search-box input { width: 100%; background: #1e293b; border: 1px solid #334155; padding: 9px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; outline: none; }

    .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 5px 12px; border-radius: 16px; font-size: 0.75rem; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .tab.active { background: #38bdf8; color: #0b1120; border-color: #38bdf8; }

    .matches-container { display: flex; flex-direction: column; gap: 10px; }
    .match-card { background: #1e293b; border-radius: 10px; padding: 12px 14px; border: 1px solid #334155; cursor: pointer; }
    .match-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
    
    .match-body { display: flex; justify-content: space-between; align-items: center; }
    .team { width: 40%; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .team img { width: 24px; height: 24px; object-fit: contain; }
    .team.away { justify-content: flex-end; text-align: right; }
    
    .score-box { background: #0b1120; padding: 5px 10px; border-radius: 6px; font-size: 1.15rem; font-weight: 800; color: #38bdf8; min-width: 55px; text-align: center; }
    .match-footer { font-size: 0.72rem; text-align: center; color: #fbbf24; font-weight: 600; margin-top: 8px; }

    .match-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #334155; font-size: 0.75rem; color: #cbd5e1; }
    .match-details.open { display: block; }
    .stat-row { margin: 6px 0; }
    .stat-labels { display: flex; justify-content: space-between; font-size: 0.7rem; color: #94a3b8; margin-bottom: 2px; }
    .stat-bar { height: 6px; background: #0b1120; border-radius: 3px; overflow: hidden; display: flex; }
    .stat-fill { height: 100%; background: #38bdf8; }
    .scorers { margin-top: 6px; padding: 6px 8px; background: #0b1120; border-radius: 6px; font-size: 0.72rem; }

    .status-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 9999px; }
    .live-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .standings-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center; }
    .standings-table th { background: #0b1120; color: #94a3b8; padding: 8px 4px; font-size: 0.68rem; }
    .standings-table td { padding: 8px 4px; border-bottom: 1px solid #334155; }
    .team-cell { display: flex; align-items: center; gap: 6px; text-align: left; font-weight: 600; }
    .team-cell img { width: 18px; height: 18px; object-fit: contain; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: #1e293b; border-radius: 12px; padding: 18px; width: 100%; max-width: 340px; border: 1px solid #334155; }
    .modal h2 { font-size: 1.1rem; color: #38bdf8; margin-bottom: 6px; }
    .modal select, .modal input, .modal textarea { width: 100%; background: #0b1120; border: 1px solid #334155; padding: 8px; border-radius: 6px; color: #fff; font-size: 0.8rem; margin-bottom: 8px; outline: none; }
    .modal textarea { height: 70px; resize: none; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Etini LiveScores</h1>
    <div class="header-btns">
      <button class="btn" onclick="openReview()">⭐ Review</button>
      <button class="btn btn-primary" onclick="initLoad()">↻ Refresh</button>
    </div>
  </header>

  <div class="view-switcher">
    <button class="view-btn active" id="btnMat" onclick="setView('matches')">⚽ Matches & Stats</button>
    <button class="view-btn" id="btnStd" onclick="setView('standings')">🏆 Standings</button>
  </div>

  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="🔍 Search team (e.g. Liverpool, Real Madrid)..." oninput="renderMatches()" />
  </div>

  <!-- Built-in League Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="setLeague('ALL', this)">All</button>
    <button class="tab" onclick="setLeague('eng.1', this)">Premier League</button>
    <button class="tab" onclick="setLeague('uefa.champions', this)">Champions League</button>
    <button class="tab" onclick="setLeague('uefa.europa', this)">Europa League</button>
    <button class="tab" onclick="setLeague('uefa.europa.conf', this)">Conference League</button>
    <button class="tab" onclick="setLeague('esp.1', this)">La Liga</button>
    <button class="tab" onclick="setLeague('ita.1', this)">Serie A</button>
    <button class="tab" onclick="setLeague('ger.1', this)">Bundesliga</button>
    <button class="tab" onclick="setLeague('fra.1', this)">Ligue 1</button>
    <button class="tab" onclick="setLeague('ksa.1', this)">Saudi Pro</button>
    <button class="tab" onclick="setLeague('usa.1', this)">MLS</button>
  </div>

  <div id="matchesView">
    <div class="matches-container" id="matchList">
      <div style="text-align:center; padding:30px; color:#94a3b8;">Loading fixtures & scores...</div>
    </div>
  </div>

  <div id="standingsView" style="display:none;">
    <div class="match-card" id="standingsList" style="padding:8px;">
      <div style="text-align:center; padding:25px; color:#94a3b8;">Select a league above to view table...</div>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal">
      <h2>Send Review ⚽</h2>
      <p style="font-size:0.75rem; color:#94a3b8; margin-bottom:10px;">Sent directly to Etini's inbox.</p>
      <form onsubmit="sendReview(event)">
        <input type="text" id="revName" placeholder="Your Name" />
        <select id="revRating">
          <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
          <option value="4">⭐⭐⭐⭐ (4/5)</option>
          <option value="3">⭐⭐⭐ (3/5)</option>
        </select>
        <textarea id="revMsg" placeholder="Your feedback..." required></textarea>
        <div class="modal-btns">
          <button type="button" class="btn" onclick="closeReview()">Close</button>
          <button type="submit" class="btn btn-primary" id="revBtn">Send</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const LEAGUE_CODES = ["eng.1", "uefa.champions", "uefa.europa", "uefa.europa.conf", "esp.1", "ita.1", "ger.1", "fra.1", "ksa.1", "usa.1"];
    let currentView = "matches";
    let activeLeague = "ALL";
    let matchesData = [];

    function setView(view) {
      currentView = view;
      document.getElementById("btnMat").classList.toggle("active", view === "matches");
      document.getElementById("btnStd").classList.toggle("active", view === "standings");
      document.getElementById("matchesView").style.display = view === "matches" ? "block" : "none";
      document.getElementById("standingsView").style.display = view === "standings" ? "block" : "none";
      document.getElementById("searchBox").style.display = view === "matches" ? "block" : "none";

      if (view === "standings") {
        if (activeLeague === "ALL") activeLeague = "eng.1";
        loadStandings(activeLeague);
      } else {
        renderMatches();
      }
    }

    function setLeague(code, btn) {
      activeLeague = code;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      btn.classList.add("active");
      if (currentView === "matches") renderMatches();
      else loadStandings(code === "ALL" ? "eng.1" : code);
    }

    async function initLoad() {
      const container = document.getElementById("matchList");
      container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">Updating live scores...</div>';

      matchesData = [];
      for (const code of LEAGUE_CODES) {
        try {
          const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard`);
          if (!res.ok) continue;
          const data = await res.json();
          if (!data.events) continue;

          data.events.forEach(ev => {
            const c = ev.competitions[0];
            const home = c.competitors.find(x => x.homeAway === "home") || c.competitors[0];
            const away = c.competitors.find(x => x.homeAway === "away") || c.competitors[1];
            
            const goals = (c.details || []).filter(d => d.scoringPlay || (d.type && d.type.text && d.type.text.toLowerCase().includes("goal"))).map(d => ({
              clock: d.clock ? d.clock.displayValue : '',
              player: d.athletesInvolved && d.athletesInvolved[0] ? d.athletesInvolved[0].displayName : 'Goal'
            }));

            matchesData.push({
              id: ev.id,
              leagueCode: code,
              leagueName: data.leagues[0]?.name || code.toUpperCase(),
              home: home.team.shortDisplayName || home.team.name,
              homeLogo: home.team.logo || '',
              homeScore: home.score ?? "-",
              away: away.team.shortDisplayName || away.team.name,
              awayLogo: away.team.logo || '',
              awayScore: away.score ?? "-",
              state: c.status.type.state,
              statusText: c.status.type.shortDetail || c.status.type.description,
              venue: c.venue ? c.venue.fullName : '',
              goals: goals
            });
          });
          renderMatches();
        } catch (e) {}
      }
      if (matchesData.length === 0) {
        container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:20px;">No games available at the moment.</div>';
      }
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const q = document.getElementById("searchInput").value.toLowerCase().trim();

      let list = matchesData;
      if (activeLeague !== "ALL") list = list.filter(m => m.leagueCode === activeLeague);
      if (q) list = list.filter(m => m.home.toLowerCase().includes(q) || m.away.toLowerCase().includes(q) || m.leagueName.toLowerCase().includes(q));

      if (list.length === 0) {
        if (matchesData.length > 0) {
          container.innerHTML = '<div class="match-card" style="text-align:center; color:#94a3b8; padding:20px;">No matching matches found.</div>';
        }
        return;
      }

      container.innerHTML = list.map(m => {
        let badge = m.statusText;
        if (m.state === "in") badge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${m.statusText}</span>`;

        let goalsHtml = m.goals.length ? `<div class="scorers">` + m.goals.map(g => `<div>⚽ ${g.player} ${g.clock}</div>`).join("") + `</div>` : '';

        return `
          <div class="match-card" onclick="toggleStats('${m.id}', '${m.leagueCode}')">
            <div class="match-header"><span>${m.leagueName}</span><span style="color:#38bdf8;">Stats ▾</span></div>
            <div class="match-body">
              <div class="team">${m.homeLogo ? `<img src="${m.homeLogo}">` : ''}<span>${m.home}</span></div>
              <div class="score-box">${m.homeScore} : ${m.awayScore}</div>
              <div class="team away"><span>${m.away}</span>${m.awayLogo ? `<img src="${m.awayLogo}">` : ''}</div>
            </div>
            <div class="match-footer">${badge}</div>
            <div class="match-details" id="d-${m.id}">
              ${goalsHtml}
              <div id="st-${m.id}" style="margin-top:8px; color:#94a3b8; text-align:center; font-size:0.7rem;">Tap to load match possession...</div>
              ${m.venue ? `<div style="font-size:0.68rem; color:#94a3b8; margin-top:6px;">📍 ${m.venue}</div>` : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    async function toggleStats(id, code) {
      const el = document.getElementById(`d-${id}`);
      if (!el) return;
      el.classList.toggle("open");
      const box = document.getElementById(`st-${id}`);
      if (el.classList.contains("open") && !box.dataset.loaded) {
        try {
          const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/summary?event=${id}`);
          const d = await res.json();
          box.dataset.loaded = "true";
          if (d.boxscore?.teams?.length >= 2) {
            const h = {}, a = {};
            d.boxscore.teams[0].statistics?.forEach(s => h[s.name] = s.displayValue);
            d.boxscore.teams[1].statistics?.forEach(s => a[s.name] = s.displayValue);
            const p = parseInt(h["possessionPct"] || "50");
            box.innerHTML = `
              <div class="stat-row">
                <div class="stat-labels"><span>${p}%</span><span>Possession</span><span>${100-p}%</span></div>
                <div class="stat-bar"><div class="stat-fill" style="width:${p}%;"></div></div>
              </div>
              <div class="stat-row"><div class="stat-labels"><span>${h["totalShots"]||0}</span><span>Shots</span><span>${a["totalShots"]||0}</span></div></div>
              <div class="stat-row"><div class="stat-labels"><span>${h["shotsOnTarget"]||0}</span><span>On Target</span><span>${a["shotsOnTarget"]||0}</span></div></div>
            `;
          } else {
            box.innerHTML = `<div>Stats will appear at kickoff.</div>`;
          }
        } catch (e) {
          box.innerHTML = `<div>Stats unavailable.</div>`;
        }
      }
    }

    async function loadStandings(code) {
      const box = document.getElementById("standingsList");
      box.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">Loading standings...</div>';
      try {
        const res = await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${code}/standings`);
        const d = await res.json();
        const entries = d.children?.[0]?.standings?.entries || d.standings?.[0]?.entries || [];
        if (!entries.length) {
          box.innerHTML = '<div style="text-align:center; padding:20px; color:#94a3b8;">Table unavailable for this cup.</div>';
          return;
        }
        let html = `<table class="standings-table"><thead><tr><th>#</th><th style="text-align:left;">Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>PTS</th></tr></thead><tbody>`;
        entries.forEach((e, i) => {
          const s = (n) => e.stats?.find(x => x.name === n)?.displayValue || "0";
          html += `<tr><td>${i+1}</td><td class="team-cell">${e.team.logos?.[0]?.href ? `<img src="${e.team.logos[0].href}">` : ''}<span>${e.team.shortDisplayName||e.team.name}</span></td><td>${s('gamesPlayed')}</td><td>${s('wins')}</td><td>${s('ties')}</td><td>${s('losses')}</td><td>${s('goalDifference')}</td><td style="font-weight:bold; color:#38bdf8;">${s('points')}</td></tr>`;
        });
        html += `</tbody></table>`;
        box.innerHTML = html;
      } catch (e) {
        box.innerHTML = '<div style="text-align:center; padding:20px; color:#ef4444;">Could not load standings.</div>';
      }
    }

    function openReview() { document.getElementById("reviewModal").classList.add("open"); }
    function closeReview() { document.getElementById("reviewModal").classList.remove("open"); }

    async function sendReview(e) {
      e.preventDefault();
      const btn = document.getElementById("revBtn");
      btn.innerText = "...";
      btn.disabled = true;
      try {
        await fetch("https://formsubmit.co/ajax/obopetini999@gmail.com", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({
            Name: document.getElementById("revName").value || "Fan",
            Rating: document.getElementById("revRating").value + " Stars",
            Message: document.getElementById("revMsg").value
          })
        });
        alert("Review sent to Etini's inbox! 🎉");
        closeReview();
      } catch (err) {
        alert("Review sent! 🙌");
        closeReview();
      } finally {
        btn.innerText = "Send";
        btn.disabled = false;
      }
    }

    initLoad();
    setInterval(initLoad, 30000);
  </script>
</body>
</html>
