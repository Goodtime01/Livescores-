<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etini LiveScores</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; padding: 16px; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
    header h1 { font-size: 1.3rem; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .refresh-btn { background: #38bdf8; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; color: #0b1120; font-size: 0.8rem; cursor: pointer; }

    /* League Filter Tabs */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .tab.active { background: #38bdf8; color: #0b1120; border-color: #38bdf8; }

    .status-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(34, 197, 94, 0.2); color: #4ade80; font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 9999px; }
    .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .matches-container { display: flex; flex-direction: column; gap: 12px; }
    .match-card { background: #1e293b; border-radius: 12px; padding: 14px 16px; border: 1px solid #334155; }
    .match-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; text-transform: uppercase; font-weight: 600; }
    
    .match-body { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .team { width: 40%; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .team img { width: 28px; height: 28px; object-fit: contain; }
    .team.away { justify-content: flex-end; text-align: right; }
    
    .score-box { background: #0b1120; padding: 6px 14px; border-radius: 8px; font-size: 1.25rem; font-weight: 800; color: #38bdf8; min-width: 65px; text-align: center; }
    
    .match-footer { font-size: 0.75rem; text-align: center; color: #fbbf24; font-weight: 600; }
    .loading { text-align: center; color: #94a3b8; padding: 35px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <h1>⚽ Etini LiveScores</h1>
    <button class="refresh-btn" onclick="loadAllMatches()">↻ Refresh</button>
  </header>

  <!-- Filter tabs -->
  <div class="tabs">
    <button class="tab active" onclick="filterLeague('ALL', this)">All</button>
    <button class="tab" onclick="filterLeague('Premier League', this)">Premier League</button>
    <button class="tab" onclick="filterLeague('Champions League', this)">Champions League</button>
    <button class="tab" onclick="filterLeague('La Liga', this)">La Liga</button>
    <button class="tab" onclick="filterLeague('Serie A', this)">Serie A</button>
  </div>

  <div class="matches-container" id="matchList">
    <div class="loading">Loading live matches from ESPN...</div>
  </div>

  <script>
    const LEAGUES = [
      { name: "Premier League", code: "eng.1" },
      { name: "Champions League", code: "uefa.champions" },
      { name: "La Liga", code: "esp.1" },
      { name: "Serie A", code: "ita.1" },
      { name: "Bundesliga", code: "ger.1" }
    ];

    let allLoadedMatches = [];
    let currentFilter = "ALL";

    async function fetchLeagueMatches(league) {
      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${league.code}/scoreboard`);
        if (!res.ok) return [];
        const data = await res.json();
        if (!data.events) return [];

        return data.events.map(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home') || comp.competitors[0];
          const away = comp.competitors.find(c => c.homeAway === 'away') || comp.competitors[1];
          const status = comp.status;

          return {
            league: league.name,
            homeName: home.team.shortDisplayName || home.team.name,
            homeLogo: home.team.logo || '',
            homeScore: home.score ?? "-",
            awayName: away.team.shortDisplayName || away.team.name,
            awayLogo: away.team.logo || '',
            awayScore: away.score ?? "-",
            state: status.type.state, // 'pre', 'in', 'post'
            detail: status.type.shortDetail || status.type.description
          };
        });
      } catch (e) {
        console.error(e);
        return [];
      }
    }

    async function loadAllMatches() {
      const container = document.getElementById("matchList");
      container.innerHTML = '<div class="loading">Fetching live games...</div>';

      const results = await Promise.allSettled(LEAGUES.map(fetchLeagueMatches));
      allLoadedMatches = results.flatMap(r => r.status === 'fulfilled' ? r.value : []);

      renderMatches();
    }

    function renderMatches() {
      const container = document.getElementById("matchList");
      const filtered = currentFilter === "ALL" 
        ? allLoadedMatches 
        : allLoadedMatches.filter(m => m.league === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="match-card" style="text-align: center; color: #94a3b8; padding: 25px;">
            <p>No games right now for this selection.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = "";
      filtered.forEach(m => {
        let statusBadge = m.detail;
        if (m.state === 'in') {
          statusBadge = `<span class="status-badge"><span class="live-dot"></span> LIVE - ${m.detail}</span>`;
        }

        container.innerHTML += `
          <div class="match-card">
            <div class="match-header">
              <span>${m.league}</span>
            </div>
            <div class="match-body">
              <div class="team">
                ${m.homeLogo ? `<img src="${m.homeLogo}" alt="" />` : ''}
                <span>${m.homeName}</span>
              </div>
              <div class="score-box">${m.homeScore} : ${m.awayScore}</div>
              <div class="team away">
                <span>${m.awayName}</span>
                ${m.awayLogo ? `<img src="${m.awayLogo}" alt="" />` : ''}
              </div>
            </div>
            <div class="match-footer">${statusBadge}</div>
          </div>
        `;
      });
    }

    function filterLeague(leagueName, btn) {
      currentFilter = leagueName;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderMatches();
    }

    // Load instantly
    loadAllMatches();

    // Auto-refresh every 30 seconds
    setInterval(loadAllMatches, 30000);
  </script>
</body>
</html>
